name: Feature request / 功能建议
description: Suggest a user problem or product improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: What is difficult today, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome / 希望获得的结果
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Possible approach / 可选方案
      description: Optional. Describe trade-offs as well as the implementation idea.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: This does not require modifying Codex files or app.asar.
          required: true
        - label: This does not require uploading credentials or executing theme scripts.
          required: true

